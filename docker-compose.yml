services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilotaudit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilotaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilotaudit}
      POSTGRES_DB: ${POSTGRES_DB:-copilotaudit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilotaudit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: copilotaudit_mlflow
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow/mlruns --default-artifact-root /mlflow/mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow/mlruns

volumes:
  pgdata:
  mlflowdata:
